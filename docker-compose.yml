services:
  # ── Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine # alpine = smaller image, same postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER} # reads from your .env file
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data # data survives container restarts
    ports:
      - "5432:5432" # exposes DB to your local machine for debugging
    healthcheck: # other services wait until DB is actually ready
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────
  backend:
    build: ./backend # builds image from backend/Dockerfile
    restart: unless-stopped
    env_file: .env # passes all .env vars into the container
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # waits for the healthcheck above to pass

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

# Named volume — Docker manages where this actually lives on disk
volumes:
  postgres_data:
